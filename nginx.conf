server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm application/xml+rss application/atom+xml image/svg+xml;

    # Brotli
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml application/json application/javascript application/wasm application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cross-origin isolation: ONNX Runtime's wasm threads need SharedArrayBuffer. The locations below set
    # their caching with `expires` only, as an add_header there would drop every header of this level.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Keep-alive
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Hashed Next.js assets - long cache
    location ^~ /_next/static/ {
        expires 1y;
    }

    # ONNX Runtime and the model weights keep their names across versions: revalidated on every load. The
    # weights are not compressed (fp16 barely shrinks), so their Content-Length drives the download progress.
    location ^~ /ort/ {
        expires epoch;

        # This nginx's mime.types has no .mjs, and a module script needs a JavaScript type (nosniff)
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
        }
    }
    location ^~ /models/ {
        expires epoch;
    }

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Remove trailing slashes
    rewrite ^(.+)/$ $1 permanent;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        proxy_pass http://localhost:8080;
    }
}
